<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="860" viewBox="0 0 1320 860">
<rect width="1320" height="860" fill="#FFFFFF"/>
<defs><marker id="a0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker></defs><rect width="1320" height="70" fill="#1F4E79"/><text x="30" y="32" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF" font-weight="bold">Figura 3. TO-BE v0.1 revisada — complemento del ERP</text><text x="30" y="56" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#C7DDF3">Piloto sintético; futura integración solo con autorización. No reemplazar ni migrar el ERP.</text><text x="35" y="815" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#0F172A">Elaboración propia · Grupo 1 · Semana 5 · Revisión v1.1 · 24/10/2026</text><text x="35" y="842" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">Leyenda: azul = aplicación/consumo; verde = datos; naranja = personas; gris = límite o control; flecha = flujo/prerrequisito.</text><rect x="35" y="130" width="280" height="140" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="50" y="160" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0F172A" font-weight="bold">ERP conservado</text><text x="50" y="188" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="start"><tspan x="50" dy="0">CodeIgniter / MySQL</tspan><tspan x="50" dy="22">Solo lectura autorizada</tspan><tspan x="50" dy="22">Sin escritura de retorno</tspan></text><rect x="355" y="130" width="280" height="140" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="370" y="160" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0F172A" font-weight="bold">Extractos por lotes</text><text x="370" y="188" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="start"><tspan x="370" dy="0">CSV sintético en PoC</tspan><tspan x="370" dy="22">Ventana y límite futuros</tspan><tspan x="370" dy="22">Sin réplica obligatoria</tspan></text><rect x="675" y="130" width="280" height="140" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="690" y="160" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0F172A" font-weight="bold">Staging / validación</text><text x="690" y="188" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="start"><tspan x="690" dy="0">SQL/Python versionados</tspan><tspan x="690" dy="22">Unidades, IDs y pruebas</tspan><tspan x="690" dy="22">Conciliación y rechazos</tspan></text><polyline points="315,200 355,200" fill="none" stroke="#334155" stroke-width="2"/><polygon points="355,200 343.0,205.0 343.0,195.0" fill="#334155"/><polyline points="635,200 675,200" fill="none" stroke="#334155" stroke-width="2"/><polygon points="675,200 663.0,205.0 663.0,195.0" fill="#334155"/><rect x="675" y="370" width="280" height="140" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="690" y="400" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0F172A" font-weight="bold">Destino analítico</text><text x="690" y="428" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="start"><tspan x="690" dy="0">Hechos y dimensiones</tspan><tspan x="690" dy="22">CSV local en el piloto</tspan><tspan x="690" dy="22">MySQL separado: candidato</tspan></text><polyline points="815,270 815,370" fill="none" stroke="#334155" stroke-width="2"/><polygon points="815,370 810.0,358.0 820.0,358.0" fill="#334155"/><rect x="355" y="370" width="280" height="140" rx="6" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="370" y="400" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0F172A" font-weight="bold">Modelo / tablero BI</text><text x="370" y="428" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="start"><tspan x="370" dy="0">Power BI: candidato</tspan><tspan x="370" dy="22">Alternativa local aprobada</tspan><tspan x="370" dy="22">Permisos por obra</tspan></text><polyline points="675,440 635,440" fill="none" stroke="#334155" stroke-width="2"/><polygon points="635,440 647.0,435.0 647.0,445.0" fill="#334155"/><rect x="35" y="370" width="280" height="140" rx="6" fill="#FFF7ED" stroke="#B45309" stroke-width="2"/><text x="50" y="400" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0F172A" font-weight="bold">Revisión humana</text><text x="50" y="428" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="start"><tspan x="50" dy="0">Costos valida las cifras</tspan><tspan x="50" dy="22">Obra y Gerencia consumen</tspan><tspan x="50" dy="22">No decisión autónoma</tspan></text><polyline points="355,440 315,440" fill="none" stroke="#334155" stroke-width="2"/><polygon points="315,440 327.0,435.0 327.0,445.0" fill="#334155"/><rect x="995" y="130" width="290" height="200" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/><text x="1010" y="160" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0F172A" font-weight="bold">Compartir en SaaS</text><text x="1010" y="188" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="start"><tspan x="1010" dy="0">Solo si se aprueba:</tspan><tspan x="1010" dy="22">licencia + identidad + RLS</tspan><tspan x="1010" dy="22">gateway para fuente privada</tspan><tspan x="1010" dy="22">No exponer MySQL a Internet</tspan></text><rect x="995" y="390" width="290" height="140" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/><text x="1010" y="420" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0F172A" font-weight="bold">Escalamiento condicional</text><text x="1010" y="448" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="start"><tspan x="1010" dy="0">Réplica MySQL / Airflow</tspan><tspan x="1010" dy="22">dbt / Prometheus / Grafana</tspan><tspan x="1010" dy="22">solo con evidencia y soporte</tspan></text><rect x="35" y="610" width="1250" height="155" rx="6" fill="#E2E8F0" stroke="#475569" stroke-width="2"/><text x="50" y="640" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0F172A" font-weight="bold">Controles transversales y fronteras</text><text x="50" y="668" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="start"><tspan x="50" dy="0">Cuenta restringida · contratos de datos · logs de estado/duración/frescura · pruebas · Git · aprobación humana.</tspan><tspan x="50" dy="22">Fuente operacional y almacenamiento analítico separados; topología real por validar. No hay conexión productiva en esta corrección.</tspan><tspan x="50" dy="22">Fuera de alcance: reemplazo ERP, agentes económicos, RAG, eventos y lakehouse.</tspan></text>
</svg>
