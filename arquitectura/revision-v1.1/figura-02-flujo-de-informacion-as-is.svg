<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="860" viewBox="0 0 1320 860">
<rect width="1320" height="860" fill="#FFFFFF"/>
<defs><marker id="a0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker></defs><rect width="1320" height="70" fill="#1F4E79"/><text x="30" y="32" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF" font-weight="bold">Figura 2. Flujo AS-IS y oportunidad</text><text x="30" y="56" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#C7DDF3">Proceso funcional del caso; no es un trazado de transacciones de producción.</text><text x="35" y="815" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#0F172A">Elaboración propia · Grupo 1 · Semana 5 · Revisión v1.1 · 24/10/2026</text><text x="35" y="842" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">Leyenda: azul = aplicación/consumo; verde = datos; naranja = personas; gris = límite o control; flecha = flujo/prerrequisito.</text><rect x="40" y="180" width="350" height="150" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="55" y="210" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0F172A" font-weight="bold">1. Registrar ejecución</text><text x="55" y="238" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="start"><tspan x="55" dy="0">Obra → partida → actividad</tspan><tspan x="55" dy="22">Tareo, metrados y costos</tspan></text><rect x="480" y="180" width="350" height="150" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="495" y="210" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0F172A" font-weight="bold">2. Conservar histórico</text><text x="495" y="238" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="start"><tspan x="495" dy="0">ERP propio / MySQL</tspan><tspan x="495" dy="22">Calidad por validar</tspan></text><rect x="920" y="180" width="350" height="150" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/><text x="935" y="210" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0F172A" font-weight="bold">3. Consolidar</text><text x="935" y="238" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="start"><tspan x="935" dy="0">Extractos y planillas</tspan><tspan x="935" dy="22">Práctica hipotética</tspan></text><polyline points="390,250 480,250" fill="none" stroke="#334155" stroke-width="2"/><polygon points="480,250 468.0,255.0 468.0,245.0" fill="#334155"/><polyline points="830,250 920,250" fill="none" stroke="#334155" stroke-width="2"/><polygon points="920,250 908.0,255.0 908.0,245.0" fill="#334155"/><rect x="480" y="440" width="350" height="150" rx="6" fill="#FFF7ED" stroke="#B45309" stroke-width="2"/><text x="495" y="470" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0F172A" font-weight="bold">4. Presupuestar / controlar</text><text x="495" y="498" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="start"><tspan x="495" dy="0">Comparar previsto y ejecutado</tspan><tspan x="495" dy="22">Revisión humana de Costos</tspan></text><polyline points="1095,330 1095,400 655,400 655,440" fill="none" stroke="#334155" stroke-width="2"/><polygon points="655,440 650.0,428.0 660.0,428.0" fill="#334155"/><rect x="100" y="660" width="1120" height="120" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/><text x="115" y="690" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0F172A" font-weight="bold">Brecha y límite de evidencia</text><text x="115" y="718" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="start"><tspan x="115" dy="0">Sin referencia común reutilizable en el escenario. Hasta 15 días es un supuesto, no medición real.</tspan><tspan x="115" dy="22">La PoC usa datos sintéticos: no prueba ahorro, adopción ni rendimiento de este flujo real.</tspan></text>
</svg>
