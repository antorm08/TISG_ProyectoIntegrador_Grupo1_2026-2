<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="860" viewBox="0 0 1320 860">
<rect width="1320" height="860" fill="#FFFFFF"/>
<defs><marker id="a0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker></defs><rect width="1320" height="70" fill="#1F4E79"/><text x="30" y="32" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF" font-weight="bold">Figura 1. Arquitectura AS-IS — ERP propio</text><text x="30" y="56" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#C7DDF3">Hecho aclarado por el equipo: CodeIgniter y MySQL. El resto del escenario se identifica como hipótesis.</text><text x="35" y="815" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#0F172A">Elaboración propia · Grupo 1 · Semana 5 · Revisión v1.1 · 24/10/2026</text><text x="35" y="842" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">Leyenda: azul = aplicación/consumo; verde = datos; naranja = personas; gris = límite o control; flecha = flujo/prerrequisito.</text><rect x="40" y="115" width="1240" height="120" rx="6" fill="#FFF7ED" stroke="#B45309" stroke-width="2"/><text x="55" y="145" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0F172A" font-weight="bold">Roles del caso académico</text><text x="55" y="173" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="start"><tspan x="55" dy="0">Gerencia · Costos/Presupuestos · Obra/Administración · Compras/Logística · TI</tspan><tspan x="55" dy="22">Roles funcionales, no cantidad de personas ni cargos verificados.</tspan></text><rect x="100" y="300" width="470" height="160" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="115" y="330" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0F172A" font-weight="bold">ERP propio — CodeIgniter</text><text x="115" y="358" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="start"><tspan x="115" dy="0">Obras, partidas, actividades, tareo, metrados</tspan><tspan x="115" dy="22">y costos: alcance funcional del caso.</tspan><tspan x="115" dy="22">Versiones y componentes internos: por validar.</tspan></text><rect x="750" y="300" width="470" height="160" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="765" y="330" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0F172A" font-weight="bold">MySQL transaccional</text><text x="765" y="358" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="start"><tspan x="765" dy="0">Registro operacional e histórico del ERP.</tspan><tspan x="765" dy="22">No se asume versión, tamaño ni réplica.</tspan><tspan x="765" dy="22">No se accede al servidor en esta revisión.</tspan></text><polyline points="570,380 750,380" fill="none" stroke="#334155" stroke-width="2"/><polygon points="750,380 738.0,385.0 738.0,375.0" fill="#334155"/><text x="660" y="360" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">acceso a datos</text><polyline points="335,235 335,300" fill="none" stroke="#334155" stroke-width="2"/><polygon points="335,300 330.0,288.0 340.0,288.0" fill="#334155"/><rect x="100" y="520" width="470" height="120" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/><text x="115" y="550" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0F172A" font-weight="bold">Planillas y documentos del escenario</text><text x="115" y="578" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="start"><tspan x="115" dy="0">Consolidación y criterios locales supuestos.</tspan><tspan x="115" dy="22">Sin productos de ofimática confirmados.</tspan></text><rect x="750" y="520" width="470" height="120" rx="6" fill="#E2E8F0" stroke="#475569" stroke-width="2"/><text x="765" y="550" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0F172A" font-weight="bold">Límites del levantamiento</text><text x="765" y="578" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="start"><tspan x="765" dy="0">Infraestructura, accesos, backups y APIs:</tspan><tspan x="765" dy="22">desconocidos; no se afirma su ausencia.</tspan></text><rect x="100" y="680" width="1120" height="90" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/><text x="115" y="710" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0F172A" font-weight="bold">Brecha académica S-08</text><text x="115" y="738" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="start"><tspan x="115" dy="0">Los históricos no se reutilizan de forma integrada para presupuestar y comparar previsto–ejecutado.</tspan></text>
</svg>
