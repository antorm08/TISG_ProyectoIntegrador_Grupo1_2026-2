, Helvetica, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle"><tspan x="755.0" dy="0">Excel de asistencia</tspan><tspan x="755.0" dy="13">carga semanal</tspan></text><rect x="915" y="110" width="250" height="110" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="1040.0" y="129" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="bold">Avance físico</text><text x="1040.0" y="140" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle"><tspan x="1040.0" dy="0">Metrados manuales</tspan><tspan x="1040.0" dy="13">actas PDF</tspan></text><rect x="1200" y="110" width="250" height="110" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="1325.0" y="129" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="bold">Control de costos</text><text x="1325.0" y="140" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle"><tspan x="1325.0" dy="0">Cruce manual</tspan><tspan x="1325.0" dy="13">Excel de costos</tspan></text><rect x="60" y="490" width="250" height="110" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="185.0" y="509" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="bold">Compras y contratos</text><text x="185.0" y="520" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle"><tspan x="185.0" dy="0">Proveedores</tspan><tspan x="185.0" dy="13">ordens</tspan></text><rect x="345" y="490" width="250" height="110" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="470.0" y="509" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="bold">Costos de materiales</text><text x="470.0" y="520" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle"><tspan x="470.0" dy="0">Presupuesto por partida</tspan><tspan x="470.0" dy="13">hoja de cálculo</tspan></text><rect x="915" y="390" width="250" height="110" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="1040.0" y="409" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="bold">Resumen ejecutivo</text><text x="1040.0" y="420" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle"><tspan x="1040.0" dy="0">Tablero manual</tspan><tspan x="1040.0" dy="13">sin fuente única</tspan></text><rect x="1200" y="390" width="250" height="110" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="1325.0" y="409" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="bold">Histórico de proyectos</text><text x="1325.0" y="420" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle"><tspan x="1325.0" dy="0">Carpeta compartida</tspan><tspan x="1325.0" dy="13">PDF y XLSX</tspan></text><rect x="1200" y="520" width="250" height="110" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="1325.0" y="539" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="bold">Exportaciones</text><text x="1325.0" y="550" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle"><tspan x="1325.0" dy="0">copia y pega</tspan><tspan x="1325.0" dy="13">entre hojas</tspan></text><rect x="1200" y="650" width="250" height="110" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 4"/><text x="1325.0" y="669" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="bold">Presupuesto a futuro</text><text x="1325.0" y="680" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle"><tspan x="1325.0" dy="0">decisión tardía</tspan><tspan x="1325.0" dy="13">varianza no temprana</tspan></text><rect x="630" y="650" width="250" height="110" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 4"/><text x="755.0" y="669" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle" font-weight="bold">Brecha de datos</text><text x="755.0" y="680" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle"><tspan x="755.0" dy="0">Sin ETL ni modelo</tspan><tspan x="755.0" dy="13">integraciones invisibles</tspan></text><polyline points="310,165 345,165" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a0)"/><text x="328" y="150" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">sync</text><polyline points="595,165 630,165" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a0)"/><polyline points="880,165 915,165" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a0)"/><polyline points="1165,165 1200,165" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a0)"/><text x="1182" y="150" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">cruce</text><polyline points="755,165 755,160 1325,160 1325,390" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a0)"/><polyline points="310,545 345,545" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a0)"/><polyline points="595,545 630,530 750,530 750,430 915,430" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a0)"/><polyline points="1165,445 1200,445" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a0)"/><polyline points="1325,500 1325,520" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a0)"/><polyline points="1325,630 1325,650" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a0)"/><polyline points="880,705 1200,705" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#a0)"/><text x="1040" y="695" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">información insuficiente</text><text x="60" y="830" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" font-style="italic">Riesgo arquitectónico: el dato viaja por correo y hojas locales; no hay trazabilidad de la transformación ni forma confiable de reconstruir un histórico comparable entre proyectos.</text>
