1280" dy="0">KPI piloto</tspan><tspan x="1280" dy="12">evidencia</tspan></text><rect x="1200" y="410" width="160" height="110" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/><text x="1280" y="430" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#0F172A" text-anchor="middle" font-weight="bold">E-10</text><text x="1280" y="447" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#0F172A" text-anchor="middle"><tspan x="1280" dy="0">v0.2 / Radar v1.0</tspan></text><text x="1280" y="478" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle"><tspan x="1280" dy="0">revisión</tspan><tspan x="1280" dy="12">nuevas tecnologías</tspan></text><polyline points="220,195 250,195" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a0)"/><polyline points="410,195 440,195" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a0)"/><polyline points="600,195 630,195" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a0)"/><polyline points="790,160 820,160" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a0)"/><polyline points="790,185 805,185 805,305 820,305" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a0)"/><polyline points="790,210 812,210 812,465 820,465" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a0)"/><polyline points="980,145 1010,145" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a0)"/><polyline points="1090,200 1090,225 1280,225 1280,250" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a0)"/><polyline points="980,305 1200,305" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a0)"/><polyline points="980,465 1120,465 1120,300 1200,300" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a0)"/><polyline points="1280,360 1280,410" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a0)"/><polyline points="220,615 995,615 995,145 1010,145" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a0)"/><polyline points="1360,465 1440,465 1440,145 1170,145" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#a0)"/><text x="1440" y="300" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">revisión continua</text><rect x="60" y="740" width="1340" height="120" rx="6" fill="#FFF7ED" stroke="#B45309" stroke-width="2"/><text x="730.0" y="759" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle" font-weight="bold">Restricciones que condicionan el mapa de dependencias</text><text x="730.0" y="770" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569" text-anchor="middle"><tspan x="730.0" dy="0">— Todo cambio se hace sin interrumpir la operación de Odoo 16.</tspan><tspan x="730.0" dy="13">— Cada decisión de ADR-01 a ADR-06 desbloquea la columna siguiente del mapa.</tspan><tspan x="730.0" dy="13">— No se adopta tecnología sin función de negocio definida (requisito del Hito I).</tspan></text><text x="60" y="940" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#475569" font-style="italic">Leyenda: flechas de izquierda a derecha = dependencia obligatoria. El mapa muestra el orden mínimo para llegar a un modelo de datos y un tablero piloto confiables.</text>
