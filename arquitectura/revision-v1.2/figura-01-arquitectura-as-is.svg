<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="30" y="39" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#0F172A" font-weight="bold">Figura 1. AS-IS: topología lógica académica</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#0F172A">K = stack aclarado por el equipo; S = supuesto del escenario; ND = desconocido. Flecha = acceso/intercambio conceptual.</text><text x="30" y="945" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#0F172A">UNMSM · FISI · Tendencias en Ingeniería de Software y Gestión · Grupo 1 · S5 · v1.2 · 25/10/2026</text><text x="30" y="972" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Elaboración propia con asistencia IA · Pendiente de validación humana · No representa inventario empresarial observado</text><rect x="35" y="105" width="1330" height="145" rx="6" fill="#FFF7ED" stroke="#B45309" stroke-width="2"/><text x="50" y="135" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#0F172A" font-weight="bold">N1 [S-22] · Puesto/navegador y roles funcionales</text><text x="50" y="168" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475569" text-anchor="start"><tspan x="50" dy="0">Gerencia · Costos/Presupuestos · Obra/Administración · Compras/Logística · TI.</tspan><tspan x="50" dy="25">Dispositivos, sedes, red y autenticación reales: ND. No se inventan equipos ni personas.</tspan></text><polyline points="400,250 400,310" fill="none" stroke="#334155" stroke-width="2"/><polygon points="400,310 395.0,298.0 405.0,298.0" fill="#334155"/><text x="660" y="285" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">F1: usuario–ERP; sesión/permisos por validar</text><rect x="35" y="310" width="1330" height="370" rx="6" fill="#F1F5F9" stroke="#64748B" stroke-width="2" stroke-dasharray="8 5"/><text x="55" y="340" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0F172A" font-weight="bold">Frontera operacional del ERP [S-22]: nodos lógicos, no servidores físicos confirmados</text><rect x="65" y="365" width="760" height="275" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="80" y="395" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#0F172A" font-weight="bold">N2 [S] · Entorno de aplicación/PHP</text><text x="80" y="428" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475569" text-anchor="start"><tspan x="80" dy="0">ERP propio CodeIgniter [K, S-14]. Versión: ND.</tspan><tspan x="80" dy="25">Módulos conceptuales: obras, partidas, actividades, tareo/HH,</tspan><tspan x="80" dy="25">metrados y costos/presupuesto.</tspan><tspan x="80" dy="25">Topología y controles de aplicación: supuestos/por levantar.</tspan></text><rect x="975" y="365" width="355" height="275" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="990" y="395" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#0F172A" font-weight="bold">N3 · MySQL [K]</text><text x="990" y="428" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="start"><tspan x="990" dy="0">Datos operacionales e</tspan><tspan x="990" dy="24">históricos.</tspan><tspan x="990" dy="24">Versión, hosting, volumen,</tspan><tspan x="990" dy="24">respaldo y accesos: ND.</tspan><tspan x="990" dy="24">Separación lógica [S].</tspan></text><polyline points="825,485 975,485" fill="none" stroke="#334155" stroke-width="2"/><polygon points="975,485 963.0,490.0 963.0,480.0" fill="#334155"/><text x="900" y="464" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">F2: datos</text><text x="845" y="530" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#0F172A">acceso solo</text><text x="845" y="555" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#0F172A">por app [S]</text><polyline points="65,590 15,590 15,710 400,710 400,740" fill="none" stroke="#334155" stroke-width="2"/><polygon points="400,740 395.0,728.0 405.0,728.0" fill="#334155"/><text x="650" y="716" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">F3: exportación fuera del ERP [S-23]</text><rect x="65" y="740" width="760" height="160" rx="6" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text x="80" y="770" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#0F172A" font-weight="bold">N4 [S-23] · Área de exportación y planillas</text><text x="80" y="803" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="start"><tspan x="80" dy="0">Costos consolida CSV/documentos del escenario; acceso autorizado</tspan><tspan x="80" dy="24">propuesto.</tspan><tspan x="80" dy="24">Sin producto ofimático confirmado; no prueba de interfaz instalada.</tspan></text><rect x="975" y="740" width="355" height="160" rx="6" fill="#FFF7ED" stroke="#B45309" stroke-width="2"/><text x="990" y="770" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#0F172A" font-weight="bold">Terceros / contexto</text><text x="990" y="803" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475569" text-anchor="start"><tspan x="990" dy="0">Clientes, proveedores, banca y</tspan><tspan x="990" dy="23">OSE.</tspan><tspan x="990" dy="23">Contratos/API: ND; sin acceso</tspan><tspan x="990" dy="23">directo a BD.</tspan></text><text x="55" y="665" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0F172A">N2/N3 pueden compartir host: no se afirma nube, dos servidores, IP, SO, firewall o red real.</text>
</svg>
