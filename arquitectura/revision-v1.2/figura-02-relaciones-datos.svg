<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="30" y="39" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#0F172A" font-weight="bold">Figura 2. AS-IS: relaciones conceptuales y granularidad</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#0F172A">Modelo del proceso; no claves foráneas ni relaciones físicas verificadas. Azul/verde = proceso/datos; flecha = asociación o derivación.</text><text x="30" y="945" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#0F172A">UNMSM · FISI · Tendencias en Ingeniería de Software y Gestión · Grupo 1 · S5 · v1.2 · 25/10/2026</text><text x="30" y="972" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Elaboración propia con asistencia IA · Pendiente de validación humana · No representa inventario empresarial observado</text><rect x="40" y="140" width="390" height="160" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="55" y="170" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#0F172A" font-weight="bold">Obra</text><text x="55" y="203" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475569" text-anchor="start"><tspan x="55" dy="0">Identificador y contexto</tspan><tspan x="55" dy="25">Una obra: varias partidas</tspan></text><rect x="505" y="140" width="390" height="160" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="520" y="170" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#0F172A" font-weight="bold">Partida</text><text x="520" y="203" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475569" text-anchor="start"><tspan x="520" dy="0">Código + unidad por obra</tspan><tspan x="520" dy="25">Una partida: actividades</tspan></text><rect x="970" y="140" width="390" height="160" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="985" y="170" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#0F172A" font-weight="bold">Actividad</text><text x="985" y="203" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475569" text-anchor="start"><tspan x="985" dy="0">Unidad de trabajo</tspan><tspan x="985" dy="25">Fecha/periodo asociado</tspan></text><polyline points="430,220 505,220" fill="none" stroke="#334155" stroke-width="2"/><polygon points="505,220 493.0,225.0 493.0,215.0" fill="#334155"/><polyline points="895,220 970,220" fill="none" stroke="#334155" stroke-width="2"/><polygon points="970,220 958.0,225.0 958.0,215.0" fill="#334155"/><rect x="40" y="410" width="390" height="190" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="55" y="440" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#0F172A" font-weight="bold">Tareo / horas-hombre</text><text x="55" y="473" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475569" text-anchor="start"><tspan x="55" dy="0">HH por actividad/periodo</tspan><tspan x="55" dy="25">Identidades anonimizadas</tspan><tspan x="55" dy="25">HH no son costo sin tarifa</tspan></text><rect x="505" y="410" width="390" height="190" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="520" y="440" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#0F172A" font-weight="bold">Rendimientos derivados</text><text x="520" y="473" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475569" text-anchor="start"><tspan x="520" dy="0">HH/unidad = HH / metrado</tspan><tspan x="520" dy="25">Productividad = metrado/HH</tspan><tspan x="520" dy="25">Denominador cero: ND</tspan></text><rect x="970" y="410" width="390" height="190" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="985" y="440" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#0F172A" font-weight="bold">Metrados</text><text x="985" y="473" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475569" text-anchor="start"><tspan x="985" dy="0">Cantidad y unidad ejecutada</tspan><tspan x="985" dy="25">Mismo contexto/periodo</tspan><tspan x="985" dy="25">No depende del tareo</tspan></text><polyline points="1165,300 1165,350 235,350 235,410" fill="none" stroke="#334155" stroke-width="2"/><polygon points="235,410 230.0,398.0 240.0,398.0" fill="#334155"/><polyline points="1165,300 1165,410" fill="none" stroke="#334155" stroke-width="2"/><polygon points="1165,410 1160.0,398.0 1170.0,398.0" fill="#334155"/><polyline points="430,505 505,505" fill="none" stroke="#334155" stroke-width="2"/><polygon points="505,505 493.0,510.0 493.0,500.0" fill="#334155"/><polyline points="970,505 895,505" fill="none" stroke="#334155" stroke-width="2"/><polygon points="895,505 907.0,500.0 907.0,510.0" fill="#334155"/><rect x="175" y="730" width="460" height="160" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="190" y="760" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#0F172A" font-weight="bold">Costos de ejecución</text><text x="190" y="793" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="start"><tspan x="190" dy="0">Materiales + mano de obra + otros</tspan><tspan x="190" dy="24">Evitar doble conteo y tarifas inventadas</tspan></text><rect x="815" y="730" width="460" height="160" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="830" y="760" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#0F172A" font-weight="bold">Histórico → presupuesto</text><text x="830" y="793" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="start"><tspan x="830" dy="0">Costo/unidad por obra/partida/periodo</tspan><tspan x="830" dy="24">Comparabilidad antes de reutilizar</tspan></text><polyline points="235,600 235,730" fill="none" stroke="#334155" stroke-width="2"/><polygon points="235,730 230.0,718.0 240.0,718.0" fill="#334155"/><polyline points="1165,600 1165,670 550,670 550,730" fill="none" stroke="#334155" stroke-width="2"/><polygon points="550,730 545.0,718.0 555.0,718.0" fill="#334155"/><polyline points="635,810 815,810" fill="none" stroke="#334155" stroke-width="2"/><polygon points="815,810 803.0,815.0 803.0,805.0" fill="#334155"/><text x="45" y="109" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#0F172A">Secuencia: Obra → Partida → Actividad → HH → Metrados/Rendimientos → Costos → Histórico; no causalidad entre mediciones.</text><text x="45" y="918" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0F172A">Tareo y metrado se vinculan por obra/partida/actividad/periodo; no por una FK confirmada.</text>
</svg>
