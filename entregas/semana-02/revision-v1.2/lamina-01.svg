<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="30" y="39" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#0F172A" font-weight="bold">S2 · Lámina 1. Business Model Canvas AS-IS</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#0F172A">Caso ficticio. Segmentos = quién compra; canales = cómo se capta/relaciona. ERP = recurso interno, no cliente.</text><text x="30" y="945" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#0F172A">UNMSM · FISI · Tendencias en Ingeniería de Software y Gestión · Grupo 1 · S2 · v1.2 · 25/10/2026</text><text x="30" y="972" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Elaboración propia con asistencia IA · Pendiente de validación humana · No representa inventario empresarial observado</text><rect x="25" y="120" width="245" height="510" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="40" y="150" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#0F172A" font-weight="bold">Socios</text><text x="40" y="183" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="start"><tspan x="40" dy="0">Proveedores,</tspan><tspan x="40" dy="24">subcontratistas,</tspan><tspan x="40" dy="24">proyectistas y</tspan><tspan x="40" dy="24">entidades</tspan><tspan x="40" dy="24">financieras</tspan></text><rect x="290" y="120" width="245" height="245" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="305" y="150" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#0F172A" font-weight="bold">Actividades</text><text x="305" y="183" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="start"><tspan x="305" dy="0">Presupuestar,</tspan><tspan x="305" dy="24">ejecutar, tarear,</tspan><tspan x="305" dy="24">medir, comprar,</tspan><tspan x="305" dy="24">valorizar y atender</tspan><tspan x="305" dy="24">posventa contractual</tspan></text><rect x="290" y="385" width="245" height="245" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="305" y="415" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#0F172A" font-weight="bold">Recursos</text><text x="305" y="448" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="start"><tspan x="305" dy="0">Personal, equipos,</tspan><tspan x="305" dy="24">capital, ERP propio</tspan><tspan x="305" dy="24">e históricos;</tspan><tspan x="305" dy="24">cantidades no</tspan><tspan x="305" dy="24">confirmadas</tspan></text><rect x="555" y="120" width="285" height="510" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="570" y="150" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#0F172A" font-weight="bold">Propuesta de valor</text><text x="570" y="183" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="start"><tspan x="570" dy="0">Obras/unidades conforme</tspan><tspan x="570" dy="24">a alcance, plazo,</tspan><tspan x="570" dy="24">calidad y obligaciones</tspan><tspan x="570" dy="24">contractuales</tspan></text><rect x="860" y="120" width="245" height="245" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="875" y="150" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#0F172A" font-weight="bold">Relación</text><text x="875" y="183" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="start"><tspan x="875" dy="0">Contrato, reuniones</tspan><tspan x="875" dy="24">de avance,</tspan><tspan x="875" dy="24">valorizaciones y</tspan><tspan x="875" dy="24">posventa</tspan></text><rect x="860" y="385" width="245" height="245" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="875" y="415" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#0F172A" font-weight="bold">Canales</text><text x="875" y="448" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="start"><tspan x="875" dy="0">Comerciales [S]:</tspan><tspan x="875" dy="24">ventas/sala e</tspan><tspan x="875" dy="24">invitaciones.</tspan><tspan x="875" dy="24">Digitales [S]: web,</tspan><tspan x="875" dy="24">redes, portales y</tspan><tspan x="875" dy="24">correo al cliente.</tspan></text><rect x="1125" y="120" width="250" height="510" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="1140" y="150" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#0F172A" font-weight="bold">Segmentos</text><text x="1140" y="183" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="start"><tspan x="1140" dy="0">Contratantes</tspan><tspan x="1140" dy="24">privados y</tspan><tspan x="1140" dy="24">compradores</tspan><tspan x="1140" dy="24">inmobiliarios;</tspan><tspan x="1140" dy="24">públicos solo cuando</tspan><tspan x="1140" dy="24">corresponda</tspan></text><rect x="25" y="665" width="665" height="225" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="40" y="695" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#0F172A" font-weight="bold">Costos</text><text x="40" y="728" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="start"><tspan x="40" dy="0">Mano de obra, materiales, subcontratos, equipos, logística,</tspan><tspan x="40" dy="24">administración y TI</tspan></text><rect x="715" y="665" width="660" height="225" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="730" y="695" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#0F172A" font-weight="bold">Ingresos</text><text x="730" y="728" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="start"><tspan x="730" dy="0">Contratos valorizados, venta de unidades y adicionales</tspan><tspan x="730" dy="24">reconocidos; no SaaS ni monetización de APIs</tspan></text>
</svg>
